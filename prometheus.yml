global:
  scrape_interval: 15s

# job과 target 정의
scrape_configs:
  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080'] # Docker Compose 서비스명 기반 접근

  - job_name: 'node-exporter'
    static_configs:
      - targets: [ 'node-exporter:9100' ]